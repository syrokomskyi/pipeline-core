# extract.config.yaml — pipeline-core standalone package export
# RFC-0098: Publish pipeline SDK packages to NPM

projectDir: packages/pipeline/pipeline-core
destName: pipeline-core
standalone: true

workspacePrefixes:
  - "@syrokomskyi/"
  - "@warpgogol/"
stripScopes:
  - "@syrokomskyi/"
  - "@warpgogol/"
  - "@wgogol/"
preservePackages: []
packageManager: "pnpm"
ignoreDirs:
  - .output
  - .debug
  - .debug-public
  - .astro
  - spec
  - .agents

extraGitignore:
  - .output
  - .debug
  - .debug-public

postProcess:
  - action: delete
    path: AGENTS.md
  - action: delete
    path: src/tests/pipeline-consumer-inventory.test.ts

git:
  remote: git@github.com:syrokomskyi/pipeline-core.git
  autoPush: true

skipSecretScan: true
versionBump: patch
